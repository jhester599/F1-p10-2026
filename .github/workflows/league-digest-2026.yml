name: 2026 League Digest Email

on:
  workflow_dispatch:
    inputs:
      round_override:
        description: "Optional numeric sheet round override for manual runs, for example 9 not R9"
        required: false
        type: string
      dry_run:
        description: "Generate digest artifacts without sending email"
        required: false
        default: true
        type: boolean
      test_recipient:
        description: "Optional test recipient override; use jeffrey.r.hester@gmail.com during validation"
        required: false
        type: string
  schedule:
    # Morning-after digest probe: runs daily during the F1 season and only
    # proceeds when yesterday had an official race. Emails include SPOILER headers.
    - cron: "0 13 * 3-12 *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: league-digest-2026
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Morning-after race preflight
        id: preflight
        env:
          EVENT_NAME: ${{ github.event_name }}
          ROUND_OVERRIDE: ${{ inputs.round_override }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.request

          YEAR = 2026
          SCHEDULE_URL = f"https://api.jolpi.ca/ergast/f1/{YEAR}.json?limit=1000"

          def write_output(**values):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  for key, value in values.items():
                      handle.write(f"{key}={value}\n")

          def sheet_round_for_official_round(official_round):
              return official_round if official_round <= 3 else official_round + 2

          event_name = os.environ.get("EVENT_NAME", "")
          round_override = os.environ.get("ROUND_OVERRIDE", "").strip()

          if event_name != "schedule":
              write_output(run_full="true", round=round_override, skip_reason="")
              raise SystemExit(0)

          today = dt.datetime.now(dt.timezone.utc).date()
          yesterday = today - dt.timedelta(days=1)
          with urllib.request.urlopen(SCHEDULE_URL, timeout=30) as response:
              payload = json.load(response)

          for race in payload["MRData"]["RaceTable"]["Races"]:
              if race.get("date") == yesterday.isoformat():
                  official_round = int(race["round"])
                  sheet_round = sheet_round_for_official_round(official_round)
                  write_output(run_full="true", round=sheet_round, skip_reason="")
                  print(
                      f"Running SPOILER digest for sheet round {sheet_round}: "
                      f"{race['raceName']}"
                  )
                  raise SystemExit(0)

          write_output(run_full="false", round="", skip_reason="No official race yesterday.")
          print("No official race yesterday.")
          PY

      - name: Digest skip notice
        if: steps.preflight.outputs.run_full != 'true'
        run: |
          echo "${{ steps.preflight.outputs.skip_reason }}"

      - name: Setup Python
        if: steps.preflight.outputs.run_full == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.preflight.outputs.run_full == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check digest secret configuration
        id: digest_cfg
        if: steps.preflight.outputs.run_full == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESULTS_SPREADSHEET_IDS: ${{ secrets.RESULTS_SPREADSHEET_IDS }}
          RESULTS_SPREADSHEET_ID: ${{ secrets.RESULTS_SPREADSHEET_ID }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RESULTS_EMAIL_FROM: ${{ secrets.RESULTS_EMAIL_FROM }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ] && { [ -n "$RESULTS_SPREADSHEET_IDS" ] || [ -n "$RESULTS_SPREADSHEET_ID" ]; }; then
            echo "sheet_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "sheet_ready=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$SMTP_SERVER" ] && [ -n "$SMTP_PORT" ] && [ -n "$SMTP_USERNAME" ] && [ -n "$SMTP_PASSWORD" ]; then
            echo "email_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "email_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate and send SPOILER league digest
        id: league_digest
        if: steps.preflight.outputs.run_full == 'true' && steps.digest_cfg.outputs.sheet_ready == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESULTS_SPREADSHEET_IDS: ${{ secrets.RESULTS_SPREADSHEET_IDS }}
          RESULTS_SPREADSHEET_ID: ${{ secrets.RESULTS_SPREADSHEET_ID }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RESULTS_EMAIL_FROM: ${{ secrets.RESULTS_EMAIL_FROM }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESULTS_DIGEST_MODEL: ${{ vars.RESULTS_DIGEST_MODEL }}
        run: |
          CMD="python scripts/67_send_league_digest.py --year 2026 --round ${{ steps.preflight.outputs.round }} --league-label 'F1 P10 League'"
          TEST_RECIPIENT="${{ inputs.test_recipient }}"
          if [ -z "$TEST_RECIPIENT" ] && [ "${{ vars.RESULTS_DIGEST_SEND_TO_PARTICIPANTS }}" != "true" ]; then
            TEST_RECIPIENT="${{ secrets.RESULTS_DIGEST_TEST_RECIPIENT }}"
            if [ -z "$TEST_RECIPIENT" ]; then
              TEST_RECIPIENT="jeffrey.r.hester@gmail.com"
            fi
          fi
          if [ -n "$TEST_RECIPIENT" ]; then
            CMD="$CMD --test-recipient '$TEST_RECIPIENT'"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ] || [ "${{ steps.digest_cfg.outputs.email_ready }}" != "true" ]; then
            CMD="$CMD --dry-run"
          else
            CMD="$CMD --send-email"
          fi
          echo "Running: $CMD"
          eval "$CMD"

      - name: Upload digest artifacts
        if: steps.preflight.outputs.run_full == 'true' && steps.digest_cfg.outputs.sheet_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: league-digest-artifacts
          path: results/league_digests/**

      - name: Missing digest secrets notice
        if: steps.preflight.outputs.run_full == 'true' && steps.digest_cfg.outputs.sheet_ready == 'false'
        run: |
          echo "Skipping SPOILER league digest because Google Sheets secrets or spreadsheet IDs are missing."
