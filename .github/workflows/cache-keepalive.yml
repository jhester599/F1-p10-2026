name: Cache keepalive

# Touches all three GitHub Actions caches every 5 days so they never hit the
# 7-day inactivity eviction window between race weekends.
# Using actions/cache (combined) with a run-number-keyed entry means each run
# produces a fresh cache entry; the restore-keys prefix makes older entries
# visible to both this workflow and the qualifying workflow.

on:
  schedule:
    - cron: "0 12 */5 * *"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Touch processed-data cache
        id: cache_processed
        uses: actions/cache@v4
        with:
          path: data/processed
          key: processed-2026-keepalive-${{ github.run_number }}
          restore-keys: |
            processed-2026-

      - name: Touch raw-data cache
        id: cache_raw
        uses: actions/cache@v4
        with:
          path: data/raw
          key: rawcache-2026-keepalive-${{ github.run_number }}
          restore-keys: |
            rawcache-2026-

      - name: Touch model-artifact cache
        id: cache_models
        uses: actions/cache@v4
        with:
          path: models
          key: models-2026-keepalive-${{ github.run_number }}
          restore-keys: |
            models-2026-

      - name: Report
        run: |
          echo "processed cache restored: ${{ steps.cache_processed.outputs.cache-hit }}"
          echo "raw cache restored:       ${{ steps.cache_raw.outputs.cache-hit }}"
          echo "models cache restored:    ${{ steps.cache_models.outputs.cache-hit }}"
          echo "Fresh keepalive entries written. Next run in ~5 days."
