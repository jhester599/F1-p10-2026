permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: qualifying-predictions-2026
  cancel-in-progress: false

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight run gate
        id: preflight
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from urllib.request import urlopen
          import os

          event_name = os.getenv("GITHUB_EVENT_NAME", "")
          out_path = os.getenv("GITHUB_OUTPUT")

          def set_output(name: str, value: str) -> None:
              if not out_path:
                  return
              with open(out_path, "a", encoding="utf-8") as f:
                  f.write(f"{name}={value}\n")

          # Manual dispatch should always proceed; override logic lives in runner script.
          if event_name != "schedule":
              set_output("run_full", "true")
              set_output("skip_reason", "")
              raise SystemExit(0)

          year = 2026
          schedule_url = f"https://raw.githubusercontent.com/sportstimes/f1/main/_db/f1/{year}.json"
          now = datetime.now(timezone.utc)
          offset_minutes = 90
          window_minutes = 150

          with urlopen(schedule_url, timeout=30) as resp:
              payload = json.loads(resp.read().decode("utf-8"))

          in_window_round = None
          for race in payload.get("races", []):
              if race.get("canceled"):
                  continue
              q = race.get("sessions", {}).get("qualifying")
              if not q:
                  continue
              qdt = datetime.fromisoformat(q.replace("Z", "+00:00"))
              run_start = qdt + timedelta(minutes=offset_minutes)
              run_end = run_start + timedelta(minutes=window_minutes)
              if run_start <= now <= run_end:
                  in_window_round = int(race["round"])
                  break

          if in_window_round is None:
              set_output("run_full", "false")
              set_output("skip_reason", "Not in qualifying+90..+240 window.")
              raise SystemExit(0)

          out_csv = Path(f"results/prediction_{year}_R{in_window_round:02d}.csv")
          if out_csv.exists():
              set_output("run_full", "false")
              set_output(
                  "skip_reason",
                  f"Prediction already exists for {year} R{in_window_round:02d}; likely completed on earlier cron slot.",
              )
              raise SystemExit(0)

          set_output("run_full", "true")
          set_output("skip_reason", "")
          PY

      - name: Setup Python
        if: steps.preflight.outputs.run_full == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Restore processed-data cache
        if: steps.preflight.outputs.run_full == 'true'
        id: cache_processed_restore
        uses: actions/cache/restore@v4
        with:
          path: data/processed
          key: processed-2026-${{ hashFiles('config.py', 'src/feature_engineering.py', 'scripts/02_build_dataset.py', 'requirements.txt') }}
          restore-keys: |
            processed-2026-

      - name: Restore raw-cache extraction
        if: steps.preflight.outputs.run_full == 'true'
        id: cache_raw_restore
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: rawcache-2026-${{ hashFiles('f1_data_cache_2026-03-09.zip') }}
          restore-keys: |
            rawcache-2026-

      - name: Restore model-artifact cache
        if: steps.preflight.outputs.run_full == 'true'
        id: cache_models_restore
        uses: actions/cache/restore@v4
        with:
          path: models
          key: models-2026-${{ hashFiles('config.py', 'src/models.py', 'scripts/03_train_models.py', 'requirements.txt') }}
          restore-keys: |
            models-2026-

      - name: Install dependencies
        if: steps.preflight.outputs.run_full == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyarrow

      - name: Run post-qualifying automation
        if: steps.preflight.outputs.run_full == 'true'
        id: run_prediction
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/65_run_qualifying_automation.py \
              --year 2026 \
              --require-schedule-window \
              --offset-minutes 90 \
              --window-minutes 150
          else
            CMD="python scripts/65_run_qualifying_automation.py --year 2026"
            if [ -n "${{ inputs.round_override }}" ]; then
              CMD="$CMD --round ${{ inputs.round_override }}"
            fi
            if [ "${{ inputs.force_rerun }}" = "true" ]; then
              CMD="$CMD --force-rerun"
            fi
            echo "Running: $CMD"
            eval "$CMD"
          fi

      - name: Preflight skip notice
        if: steps.preflight.outputs.run_full != 'true'
        run: |
          echo "Skipping full automation run."
          echo "Reason: ${{ steps.preflight.outputs.skip_reason }}"

      - name: Upload prediction artifacts
        if: steps.run_prediction.outputs.new_prediction == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prediction-2026-r${{ steps.run_prediction.outputs.round }}
          path: |
            ${{ steps.run_prediction.outputs.prediction_csv }}
            ${{ steps.run_prediction.outputs.report_path }}
            ${{ steps.run_prediction.outputs.season_log }}

      - name: Save processed-data cache
        if: steps.run_prediction.outputs.new_prediction == 'true' && steps.cache_processed_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/processed
          key: ${{ steps.cache_processed_restore.outputs.cache-primary-key }}

      - name: Save raw-cache extraction
        if: steps.run_prediction.outputs.new_prediction == 'true' && steps.cache_raw_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: ${{ steps.cache_raw_restore.outputs.cache-primary-key }}

      - name: Save model-artifact cache
        if: steps.run_prediction.outputs.new_prediction == 'true' && steps.cache_models_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: models
          key: ${{ steps.cache_models_restore.outputs.cache-primary-key }}

      - name: Commit rebuilt model artifacts
        if: steps.preflight.outputs.run_full == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: persist rebuilt model artifacts and processed data [skip ci]"
          file_pattern: |
            data/processed/*.parquet
            models/*.joblib

      - name: Stage prediction documentation
        if: steps.run_prediction.outputs.new_prediction == 'true'
        run: |
          git add -- \
            "${{ steps.run_prediction.outputs.prediction_csv }}" \
            "${{ steps.run_prediction.outputs.report_path }}" \
            "${{ steps.run_prediction.outputs.season_log }}"

      - name: Commit documentation updates
        if: steps.run_prediction.outputs.new_prediction == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: add 2026 R${{ steps.run_prediction.outputs.round }} qualifying prediction"
          file_pattern: |
            results/prediction_2026_R*.csv
            results/prediction_reports/*.md
            results/automated_predictions_2026.md

      - name: Check email secret configuration
        id: email_cfg
        if: steps.run_prediction.outputs.new_prediction == 'true'
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          PREDICTION_EMAIL_TO: ${{ secrets.PREDICTION_EMAIL_TO }}
          PREDICTION_EMAIL_FROM: ${{ secrets.PREDICTION_EMAIL_FROM }}
        run: |
          if [ -n "$SMTP_SERVER" ] && [ -n "$SMTP_PORT" ] && [ -n "$SMTP_USERNAME" ] && [ -n "$SMTP_PASSWORD" ] && [ -n "$PREDICTION_EMAIL_TO" ] && [ -n "$PREDICTION_EMAIL_FROM" ]; then
            echo "email_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "email_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send prediction email
        if: steps.run_prediction.outputs.new_prediction == 'true' && steps.email_cfg.outputs.email_ready == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.run_prediction.outputs.email_subject }}
          to: ${{ secrets.PREDICTION_EMAIL_TO }}
          from: ${{ secrets.PREDICTION_EMAIL_FROM }}
          body: ${{ steps.run_prediction.outputs.email_body }}

      - name: Missing email secrets notice
        if: steps.run_prediction.outputs.new_prediction == 'true' && steps.email_cfg.outputs.email_ready == 'false'
        run: |
          echo "Prediction generated, but email secrets are missing."
          echo "See docs/GITHUB_ACTIONS_AUTOMATION.md for required secrets."
