name: 2026 Qualifying Predictions

on:
  workflow_dispatch:
    inputs:
      round_override:
        description: "Optional round number override for manual test runs (e.g., 2 for China)"
        required: false
        type: string
      force_rerun:
        description: "Force rerun even if prediction output for that round already exists"
        required: false
        default: false
        type: boolean
  schedule:
    # 2026-specific cron triggers (qualifying +60/+75/+90 minutes, UTC).
    # The Python gate below allows execution from qualifying +90 through +240
    # to tolerate delayed Ergast/FastF1 qualifying publication.
    # Note: GitHub cron has no year field; these entries will still trigger in future years,
    # but the runner script gates execution against the 2026 published schedule window.
    # R01 Australian +60m
    - cron: "0 6 7 3 *"
    # R01 Australian +75m
    - cron: "15 6 7 3 *"
    # R01 Australian +90m
    - cron: "30 6 7 3 *"
    # R02 Chinese +60m
    - cron: "0 8 14 3 *"
    # R02 Chinese +75m
    - cron: "15 8 14 3 *"
    # R02 Chinese +90m
    - cron: "30 8 14 3 *"
    # R03 Japanese +60m
    - cron: "0 7 28 3 *"
