    # R09 British +90m
    - cron: "30 16 4 7 *"
    # R10 Belgian +60m
    - cron: "0 15 18 7 *"
    # R10 Belgian +75m
    - cron: "15 15 18 7 *"
    # R10 Belgian +90m
