    # R14 Spanish +75m
    - cron: "15 15 12 9 *"
    # R14 Spanish +90m
    - cron: "30 15 12 9 *"
    # R15 Azerbaijan +60m
    - cron: "0 13 25 9 *"
    # R15 Azerbaijan +75m
    - cron: "15 13 25 9 *"
    # R15 Azerbaijan +90m
    - cron: "30 13 25 9 *"
    # R16 Singapore +60m
    - cron: "0 14 10 10 *"
    # R16 Singapore +75m
