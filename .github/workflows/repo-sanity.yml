name: Repo Sanity

on:
  pull_request:
  push:
    branches:
      - claude/f1-tenth-place-predictor

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyarrow pytest

      - name: Compile active Python modules
        run: |
          python -m py_compile config.py predict_race.py run_pipeline.py
          python -m py_compile src/data_fetch.py src/feature_engineering.py src/models.py src/scoring.py
          python -m py_compile scripts/65_run_qualifying_automation.py scripts/90_benchmark_scorecards.py scripts/91_candidate_a_calibration_robustness.py scripts/92_candidate_a_weight_sweep.py scripts/93_validate_candidate_a_artifacts.py

      - name: Validate pytest collection
        run: pytest --collect-only -q

      - name: Run smoke tests
        run: pytest -q

      - name: Build benchmark scorecard artifact snapshot
        run: python scripts/90_benchmark_scorecards.py

      - name: Run Candidate A diagnostics with gate checks
        run: |
          if [[ -f "data/processed/features_2025_2025.parquet" ]] && ls models/*.joblib >/dev/null 2>&1; then
            echo "Running full Candidate A diagnostics (processed data + models present)."
            python scripts/91_candidate_a_calibration_robustness.py --year 2025 --enforce-gates
          else
            echo "Processed/model artifacts not available on clean CI runner; validating committed Candidate A artifacts."
            python scripts/93_validate_candidate_a_artifacts.py
          fi
