name: Repo Sanity

on:
  pull_request:
  push:
    branches:
      - claude/f1-tenth-place-predictor

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyarrow pytest

      - name: Compile active Python modules
        run: |
          python -m py_compile config.py predict_race.py run_pipeline.py
          python -m py_compile src/data_fetch.py src/feature_engineering.py src/models.py src/scoring.py
          python -m py_compile scripts/65_run_qualifying_automation.py scripts/90_benchmark_scorecards.py scripts/91_candidate_a_calibration_robustness.py scripts/92_candidate_a_weight_sweep.py

      - name: Validate pytest collection
        run: pytest --collect-only -q

      - name: Run smoke tests
        run: pytest -q

      - name: Build benchmark scorecard artifact snapshot
        run: python scripts/90_benchmark_scorecards.py

      - name: Run Candidate A diagnostics with gate checks
        run: |
          if [[ -f "data/processed/features_2025_2025.parquet" ]] && ls models/*.joblib >/dev/null 2>&1; then
            echo "Running full Candidate A diagnostics (processed data + models present)."
            python scripts/91_candidate_a_calibration_robustness.py --year 2025 --enforce-gates
          else
            echo "Processed/model artifacts not available on clean CI runner; validating committed Candidate A artifacts."
            python - <<'PY'
            import json
            from pathlib import Path
            import pandas as pd

            required = [
                Path("results/candidate_a/candidate_a_calibration_summary.csv"),
                Path("results/candidate_a/candidate_a_ranking_summary.csv"),
                Path("results/candidate_a/candidate_a_gate_report.json"),
                Path("results/scorecards/candidate_a_baseline.json"),
            ]
            missing = [str(p) for p in required if not p.exists()]
            if missing:
                raise SystemExit(f"Missing required Candidate A artifacts: {missing}")

            cal = pd.read_csv(required[0])
            rank = pd.read_csv(required[1])
            if cal.empty or rank.empty:
                raise SystemExit("Candidate A artifact validation failed: summary files are empty.")

            baseline = json.loads(required[3].read_text(encoding="utf-8"))
            if "calibration" not in baseline or "ranking" not in baseline:
                raise SystemExit("Candidate A baseline JSON is missing required keys.")

            print("Candidate A artifact fallback validation passed.")
            PY
          fi
