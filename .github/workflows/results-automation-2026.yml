name: 2026 League Results Automation

on:
  workflow_dispatch:
    inputs:
      round_override:
        description: "Optional round number override for manual runs"
        required: false
        type: string
      dry_run:
        description: "Plan updates without writing to Google Sheets"
        required: false
        default: false
        type: boolean
  schedule:
    # Scan after likely race-completion windows during the 2026 season.
    # The script is idempotent: filled Column F cells are skipped, and no email
    # is sent unless sheet rows are updated.
    - cron: "30 22 * 3-12 0,1"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: league-results-automation-2026
  cancel-in-progress: false

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Google Sheets secret configuration
        id: sheet_cfg
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESULTS_SPREADSHEET_ID: ${{ secrets.RESULTS_SPREADSHEET_ID }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ] && [ -n "$RESULTS_SPREADSHEET_ID" ]; then
            echo "sheet_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "sheet_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update league results sheet
        id: update_results
        if: steps.sheet_cfg.outputs.sheet_ready == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESULTS_SPREADSHEET_ID: ${{ secrets.RESULTS_SPREADSHEET_ID }}
        run: |
          CMD="python scripts/66_update_results_automation.py --year 2026 --update-time-series"
          if [ -n "${{ inputs.round_override }}" ]; then
            CMD="$CMD --round ${{ inputs.round_override }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          echo "Running: $CMD"
          eval "$CMD"

      - name: Missing Google Sheets secrets notice
        if: steps.sheet_cfg.outputs.sheet_ready == 'false'
        run: |
          echo "Skipping league results update because GOOGLE_SERVICE_ACCOUNT_JSON or RESULTS_SPREADSHEET_ID is missing."

      - name: Check email secret configuration
        id: email_cfg
        if: steps.update_results.outputs.updated_rows != '0' && inputs.dry_run != true
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RESULTS_EMAIL_TO: ${{ secrets.RESULTS_EMAIL_TO }}
          RESULTS_EMAIL_FROM: ${{ secrets.RESULTS_EMAIL_FROM }}
        run: |
          if [ -n "$SMTP_SERVER" ] && [ -n "$SMTP_PORT" ] && [ -n "$SMTP_USERNAME" ] && [ -n "$SMTP_PASSWORD" ] && [ -n "$RESULTS_EMAIL_TO" ] && [ -n "$RESULTS_EMAIL_FROM" ]; then
            echo "email_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "email_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send results email
        if: steps.update_results.outputs.updated_rows != '0' && inputs.dry_run != true && steps.email_cfg.outputs.email_ready == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.update_results.outputs.email_subject }}
          to: ${{ secrets.RESULTS_EMAIL_TO }}
          from: ${{ secrets.RESULTS_EMAIL_FROM }}
          body: ${{ steps.update_results.outputs.email_body }}

      - name: Missing email secrets notice
        if: steps.update_results.outputs.updated_rows != '0' && inputs.dry_run != true && steps.email_cfg.outputs.email_ready == 'false'
        run: |
          echo "League results updated, but results email secrets are missing."
