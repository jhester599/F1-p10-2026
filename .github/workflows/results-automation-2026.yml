permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: league-results-automation-2026
  cancel-in-progress: false

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Results window preflight
        id: preflight
        env:
          EVENT_NAME: ${{ github.event_name }}
          ROUND_OVERRIDE: ${{ inputs.round_override }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.request

          # Results run window: --offset-minutes 120 --window-minutes 120
          YEAR = 2026
          OFFSET_MINUTES = 120
          WINDOW_MINUTES = 120
          SCHEDULE_URL = f"https://api.jolpi.ca/ergast/f1/{YEAR}.json?limit=1000"

          def write_output(**values):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  for key, value in values.items():
                      handle.write(f"{key}={value}\n")

          def sheet_round_for_official_round(official_round):
              return official_round if official_round <= 3 else official_round + 2

          event_name = os.environ.get("EVENT_NAME", "")
          round_override = os.environ.get("ROUND_OVERRIDE", "").strip()

          if event_name != "schedule":
              write_output(run_full="true", round=round_override, skip_reason="")
              raise SystemExit(0)

          now = dt.datetime.now(dt.timezone.utc)
          with urllib.request.urlopen(SCHEDULE_URL, timeout=30) as response:
              payload = json.load(response)

          races = payload["MRData"]["RaceTable"]["Races"]
          for race in races:
              race_time = race.get("time")
              if not race_time:
                  continue
              race_start = dt.datetime.fromisoformat(
                  f"{race['date']}T{race_time.replace('Z', '+00:00')}"
              )
              window_start = race_start + dt.timedelta(minutes=OFFSET_MINUTES)
              window_end = window_start + dt.timedelta(minutes=WINDOW_MINUTES)
              if window_start <= now <= window_end:
                  official_round = int(race["round"])
                  sheet_round = sheet_round_for_official_round(official_round)
                  write_output(run_full="true", round=sheet_round, skip_reason="")
                  print(
                      f"Running sheet round {sheet_round} for official round "
                      f"{official_round}: {race['raceName']}"
                  )
                  raise SystemExit(0)

          write_output(
              run_full="false",
              round="",
              skip_reason="Not in race_start+120..+240 window.",
          )
          print("Not in race_start+120..+240 window.")
          PY

      - name: Results window skip notice
        if: steps.preflight.outputs.run_full != 'true'
        run: |
          echo "${{ steps.preflight.outputs.skip_reason }}"

      - name: Setup Python
        if: steps.preflight.outputs.run_full == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.preflight.outputs.run_full == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Google Sheets secret configuration
        id: sheet_cfg
        if: steps.preflight.outputs.run_full == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESULTS_SPREADSHEET_IDS: ${{ secrets.RESULTS_SPREADSHEET_IDS }}
          RESULTS_SPREADSHEET_ID: ${{ secrets.RESULTS_SPREADSHEET_ID }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ] && { [ -n "$RESULTS_SPREADSHEET_IDS" ] || [ -n "$RESULTS_SPREADSHEET_ID" ]; }; then
            echo "sheet_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "sheet_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update league results sheet
        id: update_results
        if: steps.preflight.outputs.run_full == 'true' && steps.sheet_cfg.outputs.sheet_ready == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESULTS_SPREADSHEET_IDS: ${{ secrets.RESULTS_SPREADSHEET_IDS }}
          RESULTS_SPREADSHEET_ID: ${{ secrets.RESULTS_SPREADSHEET_ID }}
        run: |
          CMD="python scripts/66_update_results_automation.py --year 2026 --update-time-series"
          ROUND="${{ steps.preflight.outputs.round }}"
          if [ -n "$ROUND" ]; then
            CMD="$CMD --round $ROUND"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          echo "Running: $CMD"
          eval "$CMD"

      - name: Missing Google Sheets secrets notice
        if: steps.preflight.outputs.run_full == 'true' && steps.sheet_cfg.outputs.sheet_ready == 'false'
        run: |
          echo "Skipping league results update because GOOGLE_SERVICE_ACCOUNT_JSON and RESULTS_SPREADSHEET_IDS/RESULTS_SPREADSHEET_ID are not fully configured."

      - name: Check email secret configuration
        id: email_cfg
        if: steps.update_results.outcome == 'success' && steps.update_results.outputs.updated_rows != '' && steps.update_results.outputs.updated_rows != '0' && inputs.dry_run != true
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RESULTS_EMAIL_TO: ${{ secrets.RESULTS_EMAIL_TO }}
          RESULTS_EMAIL_FROM: ${{ secrets.RESULTS_EMAIL_FROM }}
        run: |
          if [ -n "$SMTP_SERVER" ] && [ -n "$SMTP_PORT" ] && [ -n "$SMTP_USERNAME" ] && [ -n "$SMTP_PASSWORD" ] && [ -n "$RESULTS_EMAIL_TO" ] && [ -n "$RESULTS_EMAIL_FROM" ]; then
            echo "email_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "email_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send results email
        if: steps.update_results.outcome == 'success' && steps.update_results.outputs.updated_rows != '' && steps.update_results.outputs.updated_rows != '0' && inputs.dry_run != true && steps.email_cfg.outputs.email_ready == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.update_results.outputs.email_subject }}
          to: ${{ secrets.RESULTS_EMAIL_TO }}
          from: ${{ secrets.RESULTS_EMAIL_FROM }}
          body: ${{ steps.update_results.outputs.email_body }}

      - name: Missing email secrets notice
        if: steps.update_results.outcome == 'success' && steps.update_results.outputs.updated_rows != '' && steps.update_results.outputs.updated_rows != '0' && inputs.dry_run != true && steps.email_cfg.outputs.email_ready == 'false'
        run: |
          echo "League results updated, but results email secrets are missing."
